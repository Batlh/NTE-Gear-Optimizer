name: phase2a3-desktop-fields
on:
  push:
    branches: [v029-phase2a]
    paths: [src/nte_gear_optimizer_app/**, tools/a3_desktop_fields.py, tools/a4_design_geometry.py, .github/workflows/phase2a3-desktop.yml]
permissions:
  contents: read
jobs:
  fields:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      KIVY_NO_ARGS: '1'
      NTE_TEST_MODE: a3_fields
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-app.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libopengl0 libxkbcommon0 libxrandr2 libxcursor1 libxi6 libxtst6
      - if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python tools/a4_design_geometry.py
      - if: runner.os == 'Windows'
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: python tools/a4_design_geometry.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python tools/a3_desktop_fields.py build/a3_fields
      - if: runner.os == 'Windows'
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: python tools/a3_desktop_fields.py build/a3_fields
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a3-fields-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            build/a3_fields
            build/a4_geometry
  export-diagnosis:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      KIVY_GL_BACKEND: angle_sdl2
      KIVY_NO_ARGS: '1'
      NTE_TEST_MODE: a3_fields
      NTE_A3_EXPORT_ONLY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-app.txt
      - run: python tools/a3_desktop_fields.py build/a3_export_diagnosis
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a3-windows-export-diagnosis-${{ github.run_attempt }}
          path: build/a3_export_diagnosis
