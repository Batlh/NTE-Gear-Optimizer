name: phase2a3-cause-before-fix
on:
  push:
    branches: [v029-phase2a]
    paths: [tools/a3_cause_desktop.py, tools/a3_cause_android.py, tools/a3_fetch_probe_apk.py, src/nte_gear_optimizer_app/diagnostic_trace.py, .github/workflows/phase2a3-cause.yml]
permissions:
  contents: read
jobs:
  desktop-cause:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      KIVY_NO_ARGS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-app.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libopengl0 libxkbcommon0 libxrandr2 libxcursor1 libxi6 libxtst6
      - if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python tools/a3_cause_desktop.py build/a3_cause
      - if: runner.os == 'Windows'
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: python tools/a3_cause_desktop.py build/a3_cause
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a3-cause-${{ matrix.os }}
          path: build/a3_cause
  android-cause:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - name: Obtain byte-matching native probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/a3_fetch_probe_apk.py
      - name: Enable isolated runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/a3_cause_android.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a3-cause-android-${{ github.run_attempt }}
          path: |
            build/a3_android_cause
            build/a3_probe_apk.json
