name: phase2a4-performance
on:
  push:
    branches: [v029-phase2a]
    paths: [src/nte_gear_optimizer_app/**, tools/a4_*.py, .github/workflows/phase2a4-performance.yml]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        stage: [baseline, current]
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      KIVY_GL_BACKEND: angle_sdl2
      KIVY_NO_ARGS: '1'
      NTE_TEST_MODE: a4_performance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-app.txt
      - name: Bounded prior NTE build evidence
        if: matrix.stage == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/a4_fetch_prior_build_log.py
      - run: python tools/a4_run_windows_stage.py ${{ matrix.stage }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a4-performance-windows-${{ matrix.stage }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.stage == 'baseline' && 'build/a4_frozen_baseline/build/a4_performance_windows' || 'build/a4_performance_windows' }}
            build/a4_prior_build_diagnostic
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - name: Bind the exact native source payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/a3_fetch_probe_apk.py android-emulator-only-apk
      - name: Isolated CI KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/a4_performance_android.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a4-performance-android-${{ github.run_attempt }}
          path: |
            build/a4_performance_android
            build/a3_probe_apk.json

  android-controlled:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - name: Bind original A and B probe APKs without rebuilding or signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/a4_controlled_android.py prepare
      - name: Isolated CI KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/a4_controlled_android.py run
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a4-controlled-android-${{ github.run_attempt }}
          path: |
            build/a4_controlled/**/result.json
            build/a4_controlled/**/summary.json
            build/a4_controlled/controlled_result.json
            build/a4_controlled/host.json
            build/a4_controlled/prepared.json
            build/a4_controlled/**/scenario_failure.txt
            build/a4_controlled/**/app_logcat.txt
            build/a4_controlled/**/after_gestures.png
