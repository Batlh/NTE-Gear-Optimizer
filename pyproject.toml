[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nte_gear_optimizer"
version = "0.29.0.dev1"
description = "Unofficial NTE gear calculation core (in development)"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*_REV_*", "*_INTERMEDIATE_*", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E7", "E9", "F821", "F822", "F823", "F631", "F632", "F634"]

[tool.ruff.format]
quote-style = "single"

[tool.setuptools.package-data]
nte_gear_optimizer_app = ["assets/*", "assets/icons/*"]
