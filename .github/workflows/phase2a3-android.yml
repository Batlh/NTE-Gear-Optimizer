name: phase2a3-android-regression
on:
  push:
    branches: [v029-phase2a]
    paths: [src/nte_gear_optimizer_app/**, android/**, tools/a3_*.py, .github/workflows/phase2a3-android.yml]
permissions:
  contents: read
  actions: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        mode: [fields, update_static]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - name: Matching native test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/a3_fetch_probe_apk.py ${{ matrix.mode == 'update_static' && 'android-debug-apk' || 'android-emulator-only-apk' }}
      - if: matrix.mode == 'update_static'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45908701660 --repo Batlh/NTE-Gear-Optimizer --name android-debug-apk --dir build/a3_baseline_apk
      - if: matrix.mode == 'update_static'
        run: python tools/a3_verify_update_static.py
      - name: Enable isolated CI KVM
        if: matrix.mode == 'fields'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        if: matrix.mode == 'fields'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/a3_android_fields.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: a3-android-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            build/a3_android_fields
            build/a3_update
            build/a3_update_static
            build/a3_probe_apk.json
