[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nte_gear_optimizer"
version = "0.29.0.dev1"
description = "Unofficial NTE gear calculation core (in development)"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
