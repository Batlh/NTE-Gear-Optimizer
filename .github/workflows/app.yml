name: phase2a-app
on:
  push:
    branches: [v029-phase2a]
    paths-ignore: [tools/a3_*.py, tools/a4_*.py, .github/workflows/phase2a3-cause.yml, .github/workflows/phase2a4-performance.yml]
  pull_request:
    branches: [v029-phase2a]
    paths-ignore: [tools/a3_*.py, tools/a4_*.py, .github/workflows/phase2a3-cause.yml, .github/workflows/phase2a4-performance.yml]
permissions:
  contents: read
jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libopengl0 libxkbcommon0 libxrandr2 libxcursor1 libxi6
      - run: python -m pip install -r requirements-app.txt
      - run: python tools/check_app_assets.py
      - run: xvfb-run -a python tools/run_app_smoke.py --output build/linux_smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-app-smoke
          path: build/linux_smoke
  windows-bundle:
    runs-on: windows-2025
    env:
      KIVY_GL_BACKEND: angle_sdl2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-app.txt
      - run: python tools/check_app_assets.py
      - run: python tools/collect_wheel_notices.py
      - run: python tools/build_windows.py
      - run: python tools/run_app_smoke.py --exe dist/NTEGearOptimizer/NTEGearOptimizer.exe --output build/windows_smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-debug-bundle
          path: |
            dist/NTE_Gear_Optimizer_v029_Phase2A_Windows_Debug.zip
            build/windows_smoke
  android-debug:
    if: github.event_name == 'push' && github.repository == 'Batlh/NTE-Gear-Optimizer' && github.ref == 'refs/heads/v029-phase2a'
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    concurrency:
      group: phase2a-android-native-${{ matrix.abi }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      NTE_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev libbz2-dev liblzma-dev gettext autopoint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: android-cache
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r28c
            .buildozer/android/platform/build-${{ matrix.abi }}/other_builds
            .buildozer/android/platform/build-${{ matrix.abi }}/packages
            .buildozer/android/platform/build-${{ matrix.abi }}/python-installs
          key: android-${{ matrix.abi }}-py3142-kivy232-9562d1b4f306-${{ hashFiles('build_recipes/**', 'requirements-android.txt', 'buildozer.spec') }}
      - run: python -m pip install -r requirements-android.txt
      - run: python tools/configure_android_ci.py
      - run: python tools/check_android_manifest.py
      - run: python tools/stage_android.py
      - run: python tools/a4_run_android_build.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.android-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r28c
            .buildozer/android/platform/build-${{ matrix.abi }}/other_builds
            .buildozer/android/platform/build-${{ matrix.abi }}/packages
            .buildozer/android/platform/build-${{ matrix.abi }}/python-installs
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - run: python tools/record_android_dependencies.py
      - name: Sign fixed-key user test APK
        if: matrix.abi == 'arm64-v8a'
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python tools/sign_android.py
      - name: Record exact APK hashes and Python requirements
        run: python tools/record_android.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ${{ matrix.abi == 'arm64-v8a' && 'android-debug-apk' || 'android-emulator-only-apk' }}
          path: |
            bin/${{ matrix.abi == 'arm64-v8a' && '*-signed.apk' || '*.apk' }}
            build/signature.json
            build/certificate_public.txt
            build/android_artifact.json
            build/android_build_tail.txt
            build/android_build_diagnostic.json
            build/manifest_preflight
            build/android_runtime_dependencies.txt
            .buildozer/android/platform/build-*/dists/*/build/outputs/logs/manifest-merger-debug-report.txt
  android-touch-emulator:
    needs: android-debug
    if: github.event_name == 'push' && github.repository == 'Batlh/NTE-Gear-Optimizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: android-emulator-only-apk
          path: emulator_apk
      - name: Enable KVM on isolated CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/test_android_touch.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: android-touch-evidence
          path: build/emulator_touch
