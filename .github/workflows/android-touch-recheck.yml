name: phase2a-touch-recheck
on:
  push:
    branches: [v029-phase2a]
    paths: [tools/test_android_touch.py]
permissions:
  contents: read
  actions: read
jobs:
  emulator-only-recheck:
    if: github.repository == 'Batlh/NTE-Gear-Optimizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
      - id: binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/select_emulator_artifact.py
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: android-emulator-only-apk
          path: emulator_apk
          run-id: ${{ steps.binary.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/test_android_touch.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: emulator-recheck-evidence
          path: build/emulator_touch
