name: phase1-core
on:
  push:
    branches: [v029-phase1]
  pull_request:
    branches: [v029-phase1]
permissions:
  contents: read
jobs:
  core-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.13.17', '3.14.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  data-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_data_integrity.py --junitxml=data-results.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: data-integrity
          path: data-results.xml
  web-core:
    strategy:
      fail-fast: false
      matrix:
        pyodide: ['0.29.5', '314.0.8']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - run: python tools/fetch_pyodide.py ${{ matrix.pyodide }} .tools/pyodide
      - run: node tools/web_core.mjs .tools/pyodide ${{ matrix.pyodide }} > web-results.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: web-${{ matrix.pyodide }}
          path: web-results.json
